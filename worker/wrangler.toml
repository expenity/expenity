name = "expenity-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Serves at https://expenity-api.<your-subdomain>.workers.dev
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "expenity"
database_id = "31a72046-9e68-4c05-b8b4-c1cf3e678f6f"

# Brute-force protection: sign-in, register and reset (per IP), and sync (per account).
[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1101"
  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "SYNC_LIMITER"
namespace_id = "1102"
  [ratelimits.simple]
  limit = 60
  period = 60

[vars]
# WebAuthn relying party. RP_ID is the domain passkeys are bound to; RP_ORIGINS are the origins allowed to use it.
# Keep these in configuration only: moving them later invalidates passkeys (see docs/specs/07, risks R1 and R2).
RP_ID = "expenity.github.io"
RP_NAME = "Expenity"
RP_ORIGINS = "https://expenity.github.io"
APP_URL = "https://expenity.github.io/expenity/app/"
# Email (verification and recovery codes). Off until a sending domain exists (spec 07, risk R3).
# To switch on: verify a domain at resend.com, set EMAIL_FROM, run `wrangler secret put RESEND_API_KEY`, set EMAIL_ENABLED = "1".
EMAIL_ENABLED = "0"
EMAIL_FROM = "Expenity <onboarding@resend.dev>"
